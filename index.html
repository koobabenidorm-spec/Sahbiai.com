
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHBI AI - Ya Hmar, Arwah Teqra!</title>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px;text-align:center}
.badge{background:#00FF88;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold}
h1{font-size:28px;margin-top:10px} h1 span{color:#00FF88}
.circle{width:130px;height:130px;background:#111;border:3px solid #00FF88;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px;margin:auto}
.card{background:#0F0F0F;border:1px solid #222;padding:15px;border-radius:15px;font-size:14px}
.bar{background:#111;border-radius:30px;display:flex;align-items:center;padding:10px;max-width:500px;margin:20px auto;border:1px solid #333}
.bar input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:5px 15px;font-size:16px}
.mic{width:45px;height:45px;background:#00FF88;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#000;font-size:20px}
#chat{max-width:500px;margin:auto;text-align:left}
.msg{background:#111;padding:12px;border-radius:15px;margin:10px 0;border-left:3px solid #00FF88}
.user{border-left-color:#fff;text-align:right}
</style>
</head>
<body>
<div class="badge">● LIVE SAHBI AI</div>
<h1>SAHBI AI <span>Parle!</span></h1>
<p style="color:#888">Derja • Kabyle • Chaoui • Français • Arwah tehder!</p>
<div class="circle">🧔🏽</div>
<div class="grid">
<div class="card" onclick="ask('Wesh sahbi kifak?')">🗣️ Wesh kifak?</div>
<div class="card" onclick="ask('Achki ya Sahbi?')">🇩🇿 Achki?</div>
<div class="card" onclick="ask('Azul a sahbi')">♓ Azul!</div>
<div class="card" onclick="ask('Donne moi une blague algérienne')">😂 Blague DZ</div>
</div>
<div id="chat"></div>
<div class="bar">
<input id="input" placeholder="Ekteb hna ya hmar... ou clique 🎤" onkeydown="if(event.key==='Enter')send()">
<div class="mic" onclick="startVoice()">🎤</div>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);}
function ask(t){input.value=t;send();}
function sahbiReply(q){
 q=q.toLowerCase();
 if(q.includes('wesh')||q.includes('kifak')||q.includes('labass')) return "Wesh kho! Labass 3lik? Ana SAHBI, rani hna! 😎 Bikhir w nta?";
 if(q.includes('azul')||q.includes('kabyle')) return "Azul a gma! Labas fellak? Nekk SAHBI, s Tamazight, s Derja, koulchi nehder! ♓";
 if(q.includes('achki')||q.includes('blague')||q.includes('nekta')) return "Hahaha ya hmar! Gallek wahed tlaga m3a Martiou, gatlo win kont? Gallha kont naqra! Gatlo mali rak teqra sahbiai.com? 😂😂";
 if(q.includes('chaoui')) return "Ay Achaoui! Ahrur! Kech la3b? Ana nahder Chaoui tani, sahbi!";
 if(q.includes('sahra')) return "Ya sahbi ta3 Sahara, Rabi yahfedkom! Tmanrasset, Djanet, ga3 sahra fi galbi!";
 if(q.includes('qui es tu')) return "Ana SAHBI AI, l'intelligence artificielle ta3 DZ! Ndareb Derja, Kabyle, Français, Arab! Chaykha Sahbiai.com!";
 return "Aaaa sahbi "+q+"? Ya hmar arwah teqra fi Sahbiai.com! Rani nfhemek bien, 3awedli b Derja mlih! 😂";
}
function speak(t){
 if('speechSynthesis' in window){
  let u=new SpeechSynthesisUtterance(t);
  u.lang='fr-FR'; u.rate=1.1;
  speechSynthesis.speak(u);
 }
}
function send(){
 let q=input.value.trim(); if(!q) return;
 addMsg(q,'user'); input.value='';
 setTimeout(()=>{
  let r=sahbiReply(q); addMsg(r,'bot'); speak(r);
 },600);
}
function startVoice(){
 if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
  alert("Micro non supporté sur ce navigateur, utilise Chrome sahbi!");
  return;
 }
 let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
 let rec=new Rec(); rec.lang='fr-FR'; rec.start();
 addMsg("🎤 Rani nesme3 fik... ehder!",'bot');
 rec.onresult=(e)=>{
  let txt=e.results[0][0].transcript;
  input.value=txt; send();
 }
}
</script>
</body>
</html>
