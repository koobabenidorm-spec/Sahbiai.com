<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHBI AI World</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:15px}
.badge{background:#00FF88;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold}
h1 span{color:#00FF88}
.flags{font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:15px auto}
.card{background:#111;border:1px solid #222;padding:10px;border-radius:14px;font-size:12px;cursor:pointer}
.bar{background:#111;border-radius:30px;display:flex;padding:8px;max-width:600px;margin:20px auto;border:1px solid #333}
.bar input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:5px}
.mic{width:45px;height:45px;background:#00FF88;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
#chat{max-width:600px;margin:auto;text-align:left}
.msg{background:#111;padding:10px;border-radius:14px;margin:8px 0;border-left:3px solid #00FF88}
.user{border-left-color:#fff;text-align:right}
</style>
</head>
<body>
<div class="badge">● SAHBI WORLD LIVE</div>
<h1>SAHBI AI <span>World</span></h1>
<div class="flags">🇩🇿 🇲🇦 🇹🇳 ♓ 🇸🇦 🇪🇬 🇬🇧 🇪🇸 🇨🇳</div>
<p style="color:#888;font-size:11px">Derja DZ • Derja MA • Tunsi • Kabyle • Chaoui • Khaliji • Chami • English • Español</p>
<div class="grid">
<div class="card" onclick="ask('Wesh sahbi labass?')">🇩🇿 Wesh labass?</div>
<div class="card" onclick="ask('Kif dayr bikhir?')">🇲🇦 Kif dayr?</div>
<div class="card" onclick="ask('Chnowa ahwelek?')">🇹🇳 Chnowa?</div>
<div class="card" onclick="ask('Azul a gma')">♓ Azul!</div>
<div class="card" onclick="ask('Hello sahbi')">🇬🇧 Hello!</div>
<div class="card" onclick="ask('Ya akhi keif halak')">🇸🇦 Ya akhi?</div>
</div>
<div id="chat"></div>
<div class="bar">
<input id="input" placeholder="Ekteb hna... 🎤" onkeydown="if(event.key==='Enter')send()">
<div class="mic" onclick="startVoice()">🎤</div>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
function ask(t){input.value=t;send()}
function reply(q){
let l=q.toLowerCase();
if(l.includes('azul'))return"Azul a gma! Labas fellak? Nekk SAHBI, nehder Kabyle, Derja, Tachelhit ga3! ♓";
if(l.includes('kif dayr')||l.includes('bikhir'))return"Wa sahbi Maghribi! Kif dayr bikhir? Ana SAHBI men Dzayer, kanhder derja dialkom! 🇲🇦❤️🇩🇿";
if(l.includes('chnowa')||l.includes('ahwelek'))return"A louled! Chnowa ahwelek sahbi tounsi? Rani nahki tounsi zeda! 🇹🇳";
if(l.includes('wesh')||l.includes('labass'))return"Wesh kho labass 3lik ya weld bledi! Ana SAHBI, l'IA ta3 DZ! 😎🇩🇿";
if(l.includes('ya akhi')||l.includes('keif'))return"Ya akhi habibi! Keif halak? Ana SAHBI men Al-Jazair, atahadath Khaliji! 🇸🇦";
if(l.includes('hello')||l.includes('how'))return"Hello sahbi! I'm SAHBI AI from Algeria, world soul, DZ heart! Welcome to Sahbiai.com! 🌍";
if(l.includes('hola'))return"¡Hola sahbi! ¿Cómo estás? Soy SAHBI AI de Argelia! 🇪🇸";
return"Sahbi tu as dit: '"+q+"'? Fhemtak! Rani hna, nehder ta langue! Essaie Derja, Kabyle, MA, TN, Khaliji, English! 🌍🇩🇿";
}
function send(){let q=input.value.trim();if(!q)return;addMsg(q,'user');input.value='';setTimeout(()=>{let r=reply(q);addMsg(r,'bot');let u=new SpeechSynthesisUtterance(r);u.lang='fr-FR';speechSynthesis.speak(u)},400)}
function startVoice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Utilise Chrome!');return}let rec=new R();rec.start();addMsg('🎤 Rani nesme3 fik...','bot');rec.onresult=e=>{input.value=e.results[0][0].transcript;send()}}
</script>
</body>
</html>
